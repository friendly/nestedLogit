url: https://friendly.github.io/nestedLogit

template:
  bootstrap: 5
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "JetBrains Mono"}

reference:
- title: Fitting nested logit models
  desc: Core functions for specifying dichotomies and fitting nested logit models.
  contents:
  - nestedLogit
  - nestedMethods
  - models
  - as.tree

- title: Plotting methods
  desc: Methods for constructing plots of nested logit models.
  contents:
  - predict.nestedLogit
  - as.data.frame.predictNestedLogit
  - plot.nestedLogit
  - Effect.nestedLogit

- title: Hypothesis tests
  desc: Anova, linear hypothesis, and likelihood ratio tests for nested logit models.
  contents:
  - nestedHypotheses
  - RSQ

- title: Support for other packages
  desc: Methods for broom and effects packages.
  contents:
  - broomMethods
  - Effect.nestedLogit

- title: Datasets
  desc: Example datasets included in the package.
  contents:
  - GSS
  - HealthInsurance
  - gators

